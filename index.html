<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <head>
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    </head>
    <title>About Cars</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1> Car Rent Data </h1>

    <div id="loading"> Loading data ... </div>

    <div id="controls" style="display: none;">
        <button id="show-all-btn" onclick="showAllCars()"> Show All Cars</button>
        <button class="sort-btn" onclick="sortCars('km')"> Sort By KM </button>
        <button class="sort-btn" onclick="sortCars('company')"> Sort By Company </button>
        <button class="sort-btn" onclick="sortCars('model')"> Sort By Model </button>
        <button class="sort-btn" onclick="sortCars('year')"> Sort By Year </button>
        <button class="sort-btn" onclick="sortCars('costPerDay')"> Sort By Cost </button>

        <br/>
        <br/>
        <br/>
        <input id="filter-year" placeholder="Filter by year" type="number"/>
        <input id="filter-company" placeholder="Filter by company" />
        <input id="filter-km-min" placeholder="min km" />
        <input id="filter-km-max" placeholder="max km" />
        <br/>
        <br/>
        <button onclick="handleFilter()"> Filter </button>
        <button onclick="showStatists()"> Statists </button>
        <button onclick="makeGrouping()"> Grouping </button>
        
    </div>


    <div id="tableContainer" style="display: none;">
    </div>













    <div id="statistics" style="display: none;"> </div>

    <script src="script.js"></script>
</body>

</html>
