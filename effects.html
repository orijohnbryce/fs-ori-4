<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        button {
            margin: 20px;
            margin-left: 40%;
        }

        .rotate {
            animation: myspin 1s linear infinite
        }

        @keyframes myspin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .pulse {
            animation: pulse 2s ease-in infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.7);
            }

            100% {
                transform: scale(1);
            }
        }

        .slide {
            animation: slide 1s ease-in infinite;
            margin-left: 70px;
        }

        @keyframes slide {
            0% {
                transform: translateY(-100px);
            }

            50% {
                transform: translateX(0px);
                width: 50%;
            }

            100% {
                transform: translateY(-100px);
                height: 10px;
            }
        }

        .fade {
            animation: fade 3s ease-in-out infinite;
        }

        @keyframes fade {
            0% {
                opacity: 1;
            }

            50% {
                opacity: 0.3;
            }

            100% {
                opacity: 1;
            }
        }

        .color-change {
            animation: colorChange 5s linear infinite;
        }



        @keyframes colorChange {

            0% {
                background-color: #3498db;
            }

            25% {
                background-color: #e74c3c;
            }

            50% {
                background-color: #2ecc71;
            }

            75% {
                background-color: #f39c12;
            }

            100% {
                background-color: #3498db;
            }

        }
    </style>
</head>

<body>
    <button class="rotate"> click </button>
    <br />
    <br />
    <button class="pulse"> click </button>
    <br />
    <button class="slide"> click </button>
    <br />
    <br />
    <button class="fade"> click </button>
    <button class="color-change"> dddd </button>

</body>

</html>
