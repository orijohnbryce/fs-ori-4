<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="clock">Document</title>
</head>
<body>
    <div >

    </div>

    <script>
        document.querySelectorAll("#clock").textContent = new Date().toLocaleTimeString([], { hour12: false });
        
        setInterval(
            ()=>{
                document.querySelector("#clock").textContent = new Date().toLocaleTimeString([], { hour12: false });
            }
        , 1000)

    </script>
</body>
</html>
